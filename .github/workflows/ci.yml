name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install Solana CLI (if not already installed)
        shell: bash
        run: |
          set -eo pipefail

          # When running locally under `act`, skip the install entirely to avoid TLS / network issues
          if [ "${ACT:-false}" = "true" ]; then
            echo "Detected ACT=true (running under nektos/act); skipping Solana CLI installation step."
            exit 0
          fi

          if command -v solana >/dev/null 2>&1; then
            echo "Solana CLI already installed:"
            solana --version
          else
            echo "Solana CLI not found, installing..."

            # Retry a few times in case of transient TLS / network errors
            max_attempts=3
            attempt=1
            until [ "$attempt" -gt "$max_attempts" ]; do
              echo "Attempt $attempt to install Solana CLI..."
              if curl -sSfL https://release.solana.com/v1.18.0/install | sh -s - -y; then
                break
              fi
              echo "Solana install attempt $attempt failed. Retrying in 10s..."
              attempt=$((attempt + 1))
              sleep 10
            done

            if ! command -v solana >/dev/null 2>&1; then
              echo "Solana CLI still not available after retries."
              exit 1
            fi
          fi

          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          solana --version

      - name: Build
        run: cargo build --verbose

      - name: List snapshots (should not fail if none exist)
        run: cargo run -- list-snapshots

      - name: Create snapshot from existing test-ledger
        run: |
          # Ensure we start clean
          rm -rf snapshots/ci-state || true
          # If there's no ledger directory (e.g. in CI or under `act`), create a minimal one
          if [ ! -d test-ledger ]; then
            echo "test-ledger directory does not exist; creating minimal empty ledger for snapshot test"
            mkdir -p test-ledger/rocksdb
          fi
          cargo run -- snapshot ci-state

      - name: Verify snapshot appears in list
        run: |
          cargo run -- list-snapshots | tee /tmp/snapshots.txt
          grep -q "ci-state" /tmp/snapshots.txt

      - name: Load snapshot
        run: cargo run -- load ci-state

      - name: Start validator using loaded snapshot (smoke test)
        shell: bash
        run: |
          set -eo pipefail
          # If solana-test-validator is not available (e.g. running under `act` without CLI),
          # skip this step so that local workflow emulation still passes.
          if ! command -v solana-test-validator >/dev/null 2>&1; then
            echo "solana-test-validator not found on PATH; skipping start smoke test."
            exit 0
          fi

          # Run start for a short period to ensure it launches successfully.
          # timeout will terminate it after 25s if it's still running.
          timeout 25s cargo run -- start


