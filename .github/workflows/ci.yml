name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install Solana CLI (if not already installed)
        shell: bash
        run: |
          set -eo pipefail
          SOLANA_VERSION="v1.18.0"
          PRIMARY_INSTALL_URL="https://release.solana.com/${SOLANA_VERSION}/install"
          FALLBACK_INSTALL_URL="https://raw.githubusercontent.com/solana-labs/solana/${SOLANA_VERSION}/install/solana-install-init"

          # Optional escape hatch: allow explicitly skipping the install (for local debugging)
          if [ "${ACT_SKIP_INSTALL:-false}" = "true" ]; then
            echo "ACT_SKIP_INSTALL is true; skipping Solana CLI installation step."
            exit 0
          fi

          install_from_release() {
            curl -sSfL "$PRIMARY_INSTALL_URL" | sh -s - -y
          }

          retry_install() {
            local installer="$1"
            local label="$2"
            local max_attempts="${3:-3}"
            local attempt=1

            while [ "$attempt" -le "$max_attempts" ]; do
              echo "Attempt $attempt to install Solana CLI via $label..."
              if "$installer"; then
                return 0
              fi
              echo "Solana install attempt $attempt via $label failed. Retrying in 10s..."
              attempt=$((attempt + 1))
              sleep 10
            done
            return 1
          }

          if command -v solana >/dev/null 2>&1; then
            echo "Solana CLI already installed:"
            solana --version
          else
            echo "Solana CLI not found, installing..."

            if ! retry_install install_from_release "release.solana.com"; then
              echo "WARNING: Solana CLI installation failed after retries (release.solana.com)."
              echo "Continuing without Solana CLI; steps that require it will skip if the binary is missing."
            fi
          fi

          # If Solana was installed successfully, add it to PATH and show the version.
          if command -v solana >/dev/null 2>&1; then
            echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
            solana --version
          else
            echo "Solana CLI not found on PATH after install attempt; proceeding without it."
          fi

      - name: Build
        run: cargo build --verbose

      - name: List snapshots (should not fail if none exist)
        run: cargo run -- list-snapshots

      - name: Create snapshot from existing test-ledger
        run: |
          # Ensure we start clean
          rm -rf snapshots/ci-state || true
          # If there's no ledger directory (e.g. in CI or under `act`), create a minimal one
          if [ ! -d test-ledger ]; then
            echo "test-ledger directory does not exist; creating minimal empty ledger for snapshot test"
            mkdir -p test-ledger/rocksdb
          fi
          cargo run -- snapshot ci-state

      - name: Verify snapshot appears in list
        run: |
          cargo run -- list-snapshots | tee /tmp/snapshots.txt
          grep -q "ci-state" /tmp/snapshots.txt

      - name: Load snapshot
        run: cargo run -- load ci-state

      - name: Start validator using loaded snapshot (smoke test)
        shell: bash
        run: |
          set -eo pipefail
          # If solana-test-validator is not available (e.g. running under `act` without CLI),
          # skip this step so that local workflow emulation still passes.
          if ! command -v solana-test-validator >/dev/null 2>&1; then
            echo "solana-test-validator not found on PATH; skipping start smoke test."
            exit 0
          fi

          # Run start for a short period to ensure it launches successfully.
          # timeout will terminate it after 25s if it's still running.
          timeout 25s cargo run -- start


